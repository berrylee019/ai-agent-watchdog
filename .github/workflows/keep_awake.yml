name: Wake Up Apps

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

jobs:
  wake_up:
    runs-on: ubuntu-latest
    # Node.js 24 환경을 강제 적용하여 경고 해결
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install selenium webdriver-manager

      - name: Force Wake Up with Button Click
        run: |
          python - <<EOF
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from webdriver_manager.chrome import ChromeDriverManager
          import time

          # 앱 리스트 (공백 및 오타 완벽 제거)
          apps = [
              "https://style-scan-vip1.streamlit.app/",
              "https://bw-chef.streamlit.app/",
              "https://microbiome-ai-lab.streamlit.app/",
              "https://chef-noir.streamlit.app/",
              "https://stylescan-ai.streamlit.app/",
              "https://longevity-os.streamlit.app/",
              "https://misatech-surop.streamlit.app/",
              "https://robot-control.streamlit.app/",
              "https://space-ops.streamlit.app/",
              "https://dorivac-optimizer.streamlit.app/",
              "https://gilead-clinical-ai.streamlit.app/",
              "https://pet-longevity-ai.streamlit.app/",
              "https://pet-longevity.streamlit.app/",
              "https://anti-turtle-neck-ai.streamlit.app/",
              "https://oncolytic-virus.streamlit.app/",
              "https://multi-agent-dashboard.streamlit.app/",
              "https://ibos-security-center.streamlit.app/",
              "https://seoul-realty.streamlit.app/",
              "https://datacenter-orbit.streamlit.app/",
              "https://gndo-data-factory.streamlit.app/",
              "https://apr1400-licensing-copilot.streamlit.app/",
              "https://travel--assistant--ai.streamlit.app/",
              "https://ai-music-dashboard.streamlit.app/",
              "https://propview-ar.streamlit.app/",
              "https://youtube-trend-collector.streamlit.app/",
              "https://ogl-tactile-sync.streamlit.app/"
          ]

          options = Options()
          options.add_argument("--headless")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")

          driver = webdriver.Chrome(service=Service(ChromeDriverManager().install()), options=options)

          for app in apps:
              print(f"\n--- 🚨 Force Waking: {app} ---")
              try:
                  driver.get(app)
                  time.sleep(15)  # 페이지 로딩 대기 시간 소폭 증가
                  
                  # "Yes, get this app back up!" 버튼 찾기
                  # 텍스트뿐만 아니라 버튼 클래스로도 찾도록 개선
                  found = False
                  button_selectors = [
                      "//button[contains(text(), 'Yes')]",
                      "//button[contains(text(), 'back up')]",
                      "//button[contains(@class, 'stButton')]"
                  ]
                  
                  for selector in button_selectors:
                      buttons = driver.find_elements(By.XPATH, selector)
                      if buttons:
                          buttons[0].click()
                          print("   👉 Found the button and CLICKED it!")
                          time.sleep(40) # 서버 부팅 대기
                          found = True
                          break
                  
                  if not found:
                      print("   ✅ App is already awake or no button needed.")
                      time.sleep(5)
                      
              except Exception as e:
                  print(f"❌ Error on {app}: {e}")

          driver.quit()
          EOF
